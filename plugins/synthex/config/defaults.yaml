# Synthex — Project Configuration
#
# This is the default configuration for the Synthex plugin.
# To customize for your project, copy this file to:
#   .synthex/config.yaml
# in your project root.
#
# You only need to include sections you want to override.
# Unspecified values use the defaults shown here.
#
# To create this file automatically, run the `init` command.

# -------------------------------------------------------------------
# Review Loop Settings (Global)
# Shared defaults for all commands that run reviewer sub-agents.
# Individual commands can override these under their own section.
# Resolution order: per-command override > global > hardcoded default.
# -------------------------------------------------------------------
review_loops:

  # Maximum review loop iterations before forcing completion.
  # Each cycle: reviewers provide findings → caller fixes → re-review.
  # If unresolved findings remain after max cycles, they are documented
  # in the output (e.g., Open Questions, Summary).
  max_cycles: 2

  # Minimum severity level that must be addressed before exiting the loop.
  # Options: critical, high, medium, low
  # Default "high" means all CRITICAL and HIGH findings must be resolved.
  # WARN-only results (MEDIUM and below) do NOT trigger the loop.
  min_severity_to_address: high

# -------------------------------------------------------------------
# Implementation Plan Settings
# Used by the `write-implementation-plan` command
# -------------------------------------------------------------------
implementation_plan:

  # Sub-agents that review the draft implementation plan.
  # Each reviewer provides structured feedback (CRITICAL/HIGH/MEDIUM/LOW)
  # that the Product Manager must address before the plan is finalized.
  #
  # You can:
  #   - Add project-specific reviewers (e.g., security-reviewer, compliance)
  #   - Disable default reviewers by setting enabled: false
  #   - Customize the focus area for each reviewer
  reviewers:
    - agent: architect
      enabled: true
      focus: "Technical architecture, feasibility, NFR coverage, missing technical tasks"

    - agent: designer
      enabled: true
      focus: "Design tasks, UX impact, visual/interaction design clarity"

    - agent: tech-lead
      enabled: true
      focus: "Task clarity, acceptance criteria, parallelizability, dependency accuracy"

  # Maximum number of tasks to recommend for parallel execution per milestone.
  # The PM uses this to size parallelizable work batches in the plan output.
  # Can be overridden per-invocation via the `concurrent_tasks` parameter.
  concurrent_tasks: 3

  # Override: higher max_cycles for high-stakes implementation plans.
  # (Global default is 2; plans get 3 because they affect many downstream tasks.)
  review_loops:
    max_cycles: 3

# -------------------------------------------------------------------
# Refine Requirements Settings
# Used by the `refine-requirements` command
# -------------------------------------------------------------------
refine_requirements:

  # Sub-agents that review the PRD for clarity and completeness.
  # Each reviewer identifies ambiguities, gaps, and unclear areas
  # from their professional perspective.
  reviewers:
    - agent: product-manager
      enabled: true
      focus: "Requirement clarity, acceptance criteria, scope boundaries, success metrics"

    - agent: tech-lead
      enabled: true
      focus: "Technical clarity, implicit assumptions, NFR targets, missing requirements"

    - agent: designer
      enabled: true
      focus: "UX clarity, interaction patterns, accessibility, user flow completeness"

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Code Review Settings
# Used by the `review-code` command
# -------------------------------------------------------------------
code_review:

  # Reviewers to run in parallel during code review.
  # code-reviewer and security-reviewer are always recommended.
  # Add performance-engineer for performance-critical codebases.
  reviewers:
    - code-reviewer
    - security-reviewer
    # - performance-engineer  # Uncomment for performance-critical code

  # Maximum diff size (in lines) before warning about review quality.
  # Large diffs produce lower-quality reviews. Google recommends < 300 LOC.
  max_diff_lines: 300

  # Files to read for project conventions (code-reviewer uses these).
  convention_sources:
    - CLAUDE.md
    - .eslintrc
    - .prettierrc

  # Specification paths for compliance checking.
  # The code-reviewer checks code against specifications in these directories.
  spec_paths:
    - docs/specs

  # Additional specialist reviewers (optional).
  # Example: Add a domain-specific reviewer for regulated industries.
  # specialists:
  #   - agent: compliance-reviewer
  #     focus: "Regulatory compliance, audit trail requirements"

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Quality / Testing Settings
# Used by the `test-coverage-analysis` command
# -------------------------------------------------------------------
quality:

  # Coverage thresholds — new code should not drop below these.
  coverage_thresholds:
    line: 80
    branch: 70
    function: 80

  # Test runner to use for coverage reports.
  test_runner: vitest

  # High-priority modules that should always have thorough coverage.
  # Leave empty to auto-detect based on risk (auth, payments, data mutations).
  priority_modules: []

# -------------------------------------------------------------------
# Architecture Settings
# Used by `write-adr` and `write-rfc` commands
# -------------------------------------------------------------------
architecture:

  # Where Architecture Decision Records are stored.
  decisions_path: docs/specs/decisions

  # Where RFCs (Request for Comments) are stored.
  rfcs_path: docs/specs/rfcs

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Design System Settings
# Used by `design-system-audit` command and Design System Agent
# -------------------------------------------------------------------
design_system:

  # Path to the design system specification document.
  # This is the canonical reference for tokens, components, and patterns.
  spec_path: docs/specs/design-system.md

  # Directories to scan during compliance audits.
  scan_paths:
    - src/

  # Design system specialist sub-agents (optional).
  # Add framework-specific specialists for targeted guidance.
  # specialists:
  #   - agent: storybook-expert
  #     focus: "Storybook configuration, story authoring, addon guidance"
  #   - agent: figma-expert
  #     focus: "Design token sync, Figma plugin guidance, handoff workflows"

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Reliability Settings
# Used by `reliability-review` command and SRE Agent
# -------------------------------------------------------------------
reliability:

  # Path to SLO/SLI definitions document.
  slo_document: docs/specs/slos.md

  # Path to operational runbooks directory.
  runbooks_path: docs/runbooks

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Performance Audit Settings
# Used by the `performance-audit` command
# -------------------------------------------------------------------
performance_audit:

  # Per-command review loop overrides (inherits global review_loops defaults).
  # review_loops:
  #   max_cycles: 2

# -------------------------------------------------------------------
# Retrospective Settings
# Used by `retrospective` command
# -------------------------------------------------------------------
retrospective:

  # Where retrospective documents are stored.
  output_path: docs/retros

  # Retrospective format.
  # Options: start-stop-continue, 4ls, sailboat
  format: start-stop-continue

  # Maximum improvement items per cycle.
  # More than 3 competing for attention means none get done.
  max_improvement_items: 3

# -------------------------------------------------------------------
# Next Priority Settings
# Used by the `next-priority` command
# -------------------------------------------------------------------
next_priority:

  # Maximum number of tasks to execute in parallel.
  # Can be overridden per-invocation via the `concurrent_tasks` parameter.
  concurrent_tasks: 3

# -------------------------------------------------------------------
# Worktree Settings
# Used by the `next-priority` command for parallel task execution
# -------------------------------------------------------------------
worktrees:

  # Base directory for git worktrees created during parallel execution.
  # Relative paths resolve from the repository root.
  # Use an absolute path (e.g., /tmp/) to place worktrees outside the repo.
  #
  # Default aligns with Claude Code's own convention (.claude/worktrees/).
  # Ensure this path is in your .gitignore.
  base_path: .claude/worktrees

  # Prefix for worktree branch names.
  branch_prefix: "feature/"

# -------------------------------------------------------------------
# Document Paths
# Default locations for key project documents.
# These can also be overridden via command parameters.
# -------------------------------------------------------------------
documents:
  requirements: docs/reqs/main.md
  implementation_plan: docs/plans/main.md
  specs: docs/specs
  decisions: docs/specs/decisions
  rfcs: docs/specs/rfcs
  runbooks: docs/runbooks
  retros: docs/retros

  # Which storage backend serves each document type.
  # `filesystem` (default) reads and writes the paths above using local markdown
  # files — today's behavior, unchanged. `notion` routes documents to an existing
  # Notion workspace via the `notion:` block below.
  # Requires `notion.enabled: true`; setting `notion` here without enabling the
  # feature is a configuration error, not a silent opt-in.
  backend: filesystem

  # Optional per-document-type override of `backend`, as a map of
  # <doc_type>: <backend>. Resolution order, first match wins:
  #   backend_overrides.<doc_type>  >  backend  >  filesystem
  # This mirrors the review_loops idiom (per-command > global > hardcoded).
  # Use it to put the artifacts non-engineers read in Notion while leaving the
  # ones Synthex itself reads on every run (specs, decisions) on local disk.
  # Must be a map, never a list: config-merger.ts replaces arrays wholesale, so
  # a list here would make a project override silently drop the other entries.
  # Example:
  #   backend_overrides:
  #     requirements: notion
  #     implementation_plan: notion
  #     retros: notion
  backend_overrides: {}

# ────────────────────────────────────────────────────────────────────────────
# Multi-model review (FR-MR5) — off by default; users opt in via /init or by
# editing this config. When enabled, the orchestrator fans review work out
# across multiple LLM families (OpenAI, Google, local-Ollama) for richer,
# correlation-resistant consolidation. CLI-only (no API keys in Synthex).
# ────────────────────────────────────────────────────────────────────────────
multi_model_review:
  # Master switch. When false, today's native-only review behavior is preserved
  # byte-identically (FR-MR23 regression contract).
  enabled: false

  # Strict mode: when true, preflight failures abort the review. When false,
  # missing CLIs degrade gracefully to whatever proposers are available.
  strict_mode: false

  # When true, native Synthex sub-agents participate alongside external adapters.
  # When false, only externals run. Almost always true — set false only when
  # specifically isolating external behavior.
  include_native_reviewers: true

  # Minimum number of unique families across all configured proposers (counting
  # natives as `anthropic`). Below this, preflight emits a family-diversity
  # warning. Default 2 mirrors PRD recommendation.
  min_family_diversity: 2

  # Minimum number of available proposers required to proceed. Below this,
  # preflight aborts (strict_mode) or emits a critical warning (lenient).
  min_proposers_to_proceed: 2

  # External proposer adapter list. Each entry references a `*-review-prompter`
  # agent name. Empty list means "natives only" — equivalent to today's review.
  # Adapters not installed at preflight surface as `error_code: cli_missing`.
  reviewers: []
  # Example:
  # reviewers:
  #   - codex-review-prompter      # OpenAI / Codex CLI
  #   - gemini-review-prompter     # Google / gcloud
  #   - ollama-review-prompter     # Local model (qwen, llama, deepseek, etc.)

  # Per-reviewer overrides. Each adapter may override its default model, family
  # tag, or invocation flags. Use the agent name as the key.
  per_reviewer:
    # codex-review-prompter:
    #   model: gpt-5
    #   family: openai
    # ollama-review-prompter:
    #   model: qwen2.5-coder:32b
    #   family: local-qwen

  # Aggregator (consolidation step) configuration.
  aggregator:
    # `auto` resolves via FR-MR15 strict-total-order tier table (D17):
    # Claude Opus > GPT-5 > Claude Sonnet > Gemini 2.5 Pro > DeepSeek V3 > Qwen 32B.
    # When the strongest configured proposer is also a reviewer, the aggregator
    # invocation is a separate freshly-spawned CLI call with judge-mode prompt.
    # When no flagship matches, falls back to the host Claude session.
    command: auto

  # Per-command overrides. Each command can opt in or out independently.
  per_command:
    review_code:
      enabled: false               # When true, /review-code uses multi-model
      complexity_gate:             # FR-MR21a: skip multi-model on trivial diffs
        threshold_lines_changed: 50
        threshold_files_touched: 3
        # Diffs touching these path globs ALWAYS escalate to multi-model:
        always_escalate_paths:
          - "**/auth/**"            # Authentication code — security-critical
          - "**/payments/**"        # Payment flows — financial-critical
          - "**/billing/**"         # Billing logic — financial-critical
          - "**/migrations/**"      # DB migrations — irreversible / data-loss risk
          - "**/security/**"        # Anything in a security namespace
          - "**/secrets/**"         # Secret handling — credential exposure risk
          - "**/crypto/**"          # Crypto code — subtle correctness matters
    write_implementation_plan:
      enabled: false               # When true, plan-review uses multi-model
      # No complexity gate for plan review (FR-MR22): plans are always reviewed.
    team_review:
      enabled: false               # FR-MMT3: when true, /team-review uses multi-model orchestration
      # No complexity gate for team-review (parallels FR-MR22's design for write-implementation-plan):
      # team-review is invoked deliberately for high-risk changes; the user has already opted in

  # Consolidation pipeline configuration.
  consolidation:
    # Stage 2 lexical Jaccard merge threshold (default 0.8 per FR-MR14).
    stage2_jaccard_threshold: 0.8
    # Stage 3 (embedding-based) — Phase 7 follow-up; not active in v1.
    stage3_embedding_threshold: 0.85
    stage4:
      # Per-consolidation hard cap on Stage 4 LLM tiebreaker calls (D18).
      # Prevents N² blow-up when many candidate pairs share buckets.
      max_calls_per_consolidation: 25

  # Per-finding minority-of-one demotion (FR-MR14b).
  minority_of_one:
    enabled: true
    skip_categories: ["security"]   # Security findings never demoted

  # Audit artifact (FR-MR24): per-invocation review record for traceability.
  audit:
    # When true, every multi-model invocation writes an audit file.
    enabled: true
    # Output directory; created if absent. Relative paths resolve against the
    # project root.
    output_path: "docs/reviews/"
    # Where adapters write their raw invocation outputs (one file per call).
    raw_output_path: "docs/reviews/raw/"
    # FR-MMT30a: when true, audit artifact captures per-finding attribution telemetry
    # (consolidated_finding_id, raised_by[], consensus_count, minority_of_one)
    record_finding_attribution_telemetry: true

  # External CLI permission model (ADR-003 / D27).
  # Per-CLI permission mode for external review-prompter adapters.
  # Three patterns:
  #   - read-only       (Pattern 1, default): adapter invokes its CLI with
  #                     read-only / plan-mode / --sandbox flags. The CLI cannot
  #                     edit files, run shell commands, or modify state. Safe
  #                     default for every environment.
  #   - parent-mediated (Pattern 3): adapter invokes its CLI in a mode that
  #                     proxies tool-use approval requests back to the parent
  #                     Claude session (Codex app-server requestApproval,
  #                     Claude Code canUseTool over --output-format stream-json).
  #                     The parent session decides per request. Use this for
  #                     CLIs that natively support approval proxying.
  #   - sandbox-yolo    (Pattern 2): adapter invokes its CLI with full tool
  #                     permissions inside an OS-level sandbox. Faster but
  #                     riskier. Requires explicit user confirmation at spawn.
  #                     Opt in only when you trust the CLI inside the sandbox.
  #
  # Defaults applied per CLI: Codex and Claude Code default to parent-mediated
  # (Pattern 3) because their CLIs natively support approval proxying. All
  # other CLIs default to read-only (Pattern 1) — the universal safe default.
  # Override any entry here per project to opt into sandbox-yolo (Pattern 2)
  # for a specific CLI; the spawning command will require explicit y/N
  # confirmation when sandbox-yolo is configured.
  external_permission_mode:
    # Universal default applied to any CLI not explicitly listed below.
    default: read-only
    #
    # Allowed keys: `default`, plus the bare adapter names listed below
    # (`codex`, `claude`, `gemini`, `bedrock`, `llm`, `ollama`). Any other
    # key in this block is **silently ignored** by the adapters and is
    # never propagated to a shell invocation. The adapter binary names
    # (`which codex`, `which gemini`, `which aws`, etc.) are HARDCODED
    # in each `*-review-prompter` agent's Step 1 (CLI Presence Check) —
    # they are NOT derived from these config-key names. This prevents
    # an adversarial project config from injecting a path-traversal or
    # shell-metacharacter binary name. The Layer 1 schema test
    # `tests/schemas/external-permission-mode-key-validation.test.ts`
    # enforces this allow-list (Task 88 / Phase 11.2 / Security MEDIUM #4).
    #
    # Per-CLI defaults. CLI names are the bare adapter name (the
    # `<cli>-review-prompter` agent file's prefix).
    codex: parent-mediated      # Pattern 3 via `codex app-server` JSON-RPC requestApproval
    claude: parent-mediated     # Pattern 3 via Claude Code `canUseTool` over --output-format stream-json
    gemini: read-only           # Pattern 1 via `--readonly` flag
    bedrock: read-only          # Pattern 1 — `aws bedrock-runtime invoke-model` has no tool-use surface
    llm: read-only              # Pattern 1 — `llm` CLI is a stateless provider-API wrapper
    ollama: read-only           # Pattern 1 — Ollama HTTP API has no tool-use surface

  # Pattern 2 (sandbox-yolo) trust-boundary configuration.
  # Defines the OS-sandbox wrappers used when a CLI is configured for
  # sandbox-yolo. Without these, Pattern 2 has no real sandbox and
  # effectively grants full permissions — Pattern 2-capable adapters
  # MUST verify the configured profile/flags exist before spawning
  # (Step 0 profile-existence check; Task 87 / Phase 11.2).

  # macOS sandbox-exec profile path. Pattern 2 wraps the CLI as
  # `sandbox-exec -f <path> <cli-invocation>`. The shipped default
  # denies network egress, denies file-writes outside /tmp, and limits
  # reads to the current working directory subtree. Override per
  # project to relax or tighten as needed.
  sandbox_profile_path: "plugins/synthex/config/sandbox.sb"

  # Linux bwrap (bubblewrap) flag set. Pattern 2 wraps the CLI as
  # `bwrap <flags> <cli-invocation>`. The shipped default creates a
  # read-only root with a writable /tmp; processes inherit the host's
  # network namespace (set `--unshare-net` to also block network).
  # Override per project to harden or relax. Flags are applied in
  # order; first match wins for overlapping mounts.
  sandbox_bwrap_flags: "--ro-bind / / --bind /tmp /tmp --proc /proc --dev /dev"

# ────────────────────────────────────────────────────────────────────────────
# Notion backend (FR-NB1) — off by default. Routes Synthex's documents and
# implementation-plan task state into a Notion workspace that ALREADY EXISTS,
# so its output shows up inside the process a team already runs.
#
# The governing principle is bolt-on compatibility: Synthex adapts to the
# workspace it finds and never imposes a structure on it. It roots documents
# under a page you nominate, writes tasks into a database you nominate, maps
# onto that database's existing properties, and scopes every row it touches to
# a epic reference so it cannot see or modify other teams' tickets.
#
# Access is via the Notion MCP server — Synthex never holds a Notion API key.
# Run `/synthex:configure-notion` to set this up interactively rather than
# editing this block by hand; the wizard discovers your database's real schema
# and offers valid mappings.
# ────────────────────────────────────────────────────────────────────────────
notion:
  # Master switch. When false, every document operation routes to the
  # filesystem backend and behaves byte-identically to pre-Notion Synthex
  # (FR-NB2 regression contract). Nothing below has any effect until this is
  # true — including `documents.backend: notion`.
  enabled: false

  # Failure policy. When false (default), any Notion error falls back to the
  # filesystem backend for that document type and emits a warning naming the
  # error code — work continues against local markdown. When true, errors
  # abort the command instead. Enable this where a silent divergence between
  # Notion and local state would be worse than a failed command.
  # Two failures never fall back regardless: an unscoped-query risk
  # (see `epic` below) and a missing required property mapping.
  strict_mode: false

  # An EXISTING Notion database whose rows are your epics or initiatives, as a
  # URL or database ID. Every row in a Notion database is itself a page that
  # can hold subpages, so Synthex hangs each initiative's documents — its PRD,
  # implementation plan, and retrospectives — beneath that initiative's own
  # row. The row becomes the single entry point for everything about it.
  # Synthex links to rows you already have; it offers to create one only when
  # you ask, and never fills in fields it does not own.
  # Leave null if your epics are a tag on the work database rather than
  # rows in their own database.
  epics_database: null

  # An EXISTING Notion database holding the work items your epics break down
  # into, as a URL or database ID. Synthex's tasks live alongside whatever else
  # the team tracks there, which is why `epic` below is mandatory.
  # If null, `/synthex:configure-notion` offers to create one.
  tasks_database: null

  # An EXISTING Notion page for CROSS-CUTTING documents only — specs, ADRs,
  # RFCs, and runbooks, which outlive any single initiative and have no epic to
  # hang from. Epic-scoped documents ignore this and resolve against their own
  # epic row instead.
  # These types default to the filesystem backend, because Synthex reads them
  # on every review invocation and they are engineering-internal, so most
  # projects never need to set this.
  docs_root: null

  # Resolved page IDs per document type, as a map of <doc_type>: <page id>.
  # `/synthex:configure-notion` writes these as it nominates or creates each
  # target. This is the deterministic resolution path and it survives a page
  # being renamed; without an entry, Synthex falls back to matching a child of
  # `docs_root` by title, which fails rather than guessing if several match.
  # Populated by the wizard — you should not need to edit this by hand.
  # Must be a map, never a list.
  targets: {}

  # Epic scoping (FR-NB4) — the multi-team safety guarantee, and the
  # reason this integration can point at a live shared board at all.
  # Every row Synthex creates is stamped with `value`, and EVERY query Synthex
  # issues filters on `property` = `value`. Synthex therefore cannot read or
  # mutate tickets belonging to other epics.
  # Both keys are required when `tasks_database` is set. Synthex refuses to run
  # unscoped against a shared database — falling back to an unfiltered query is
  # never an acceptable degradation.
  #
  # The PROPERTY is a fact about your database's schema, so it is set once here.
  # The VALUE identifies one initiative, and a repo commonly has several in
  # flight at once — so each implementation plan carries its own value on a
  # `**Epic:**` line beneath its H1. Resolution, first match wins:
  #   the plan's `**Epic:**` line  >  `value` below  >  refuse to run
  # Binding the value to the plan makes targeting the wrong initiative
  # structurally impossible: a command cannot touch task rows without having
  # read the plan those rows belong to, and that plan names its epic.
  epic:
    # Name of the property on `tasks_database` that links a work item to its
    # epic — commonly a relation property literally called "Epic".
    # Any type that can be filtered for equality works: relation, select,
    # multi-select, status, or plain text. A relation is the normal shape and
    # the only one that also lets Synthex anchor documents to the epic page.
    #
    # Name this property exactly, and be sure it is the one your team actually
    # uses for the epic linkage. A database may carry other similarly-named
    # fields left over from an earlier process; pointing Synthex at one of
    # those yields queries that match nothing, which looks like "no work left"
    # rather than like a misconfiguration. `/synthex:configure-notion` lists
    # the real candidates with their types so you can pick deliberately.
    property: null
    # Default epic value, used only for plans that do not declare their
    # own. Single-initiative projects can just set this and never think about
    # it. Multi-initiative repos should leave it null and let each plan speak
    # for itself, so a plan can never silently inherit the wrong epic.
    value: null

  # Assignee scoping — relevant when several engineers share one epic.
  # Epic scoping alone still lets two engineers select the same item, so
  # when `property` is set, task queries are additionally scoped to work the
  # invoking engineer may legitimately take: assigned to them, OR unassigned.
  # Items assigned to somebody else are never selected or modified.
  # Synthex creates new items unassigned (a planned task is available work),
  # then claims one by assigning it to the current user when moving it to
  # in-progress. That claim is what stops two engineers taking the same item.
  # The current user is resolved from Notion at runtime — nothing here
  # identifies you.
  # Leave `property` null to skip assignee scoping entirely, which is fine when
  # an epic is effectively owned by one engineer at a time.
  assignee:
    # A person property on `tasks_database`.
    property: null
    # Whether unassigned items are considered claimable. Setting this false
    # restricts Synthex to items already assigned to you, which means it will
    # not pick up newly planned work until someone assigns it.
    include_unassigned: true

  # Maps Synthex's canonical task fields onto your database's actual property
  # names, as a map of <canonical_field>: <your property name>.
  # Required: title, status, epic. Without all three Synthex refuses to
  # operate (error code `schema_mismatch`) rather than guess.
  # Optional: complexity, milestone, dependencies, acceptance_criteria. When one
  # is unmapped it degrades gracefully — the data is recorded in the plan
  # overview page or the task page body instead of becoming a queryable column.
  # Synthex NEVER alters an existing database's schema without explicit consent.
  # Must be a map, never a list (see `documents.backend_overrides`).
  # Example:
  #   property_map:
  #     title: Name
  #     status: Status
  #     epic: Team
  #     complexity: Size
  property_map: {}

  # Maps Synthex's canonical task states onto the option names your database
  # already uses, as a map of <canonical_state>: <your option name>.
  # Canonical states are: pending, in_progress, done, blocked.
  # Teams have their own vocabulary, so this avoids forcing Synthex's words
  # onto an established board. Unmapped states fall back to the canonical name.
  # Must be a map, never a list.
  # Example:
  #   status_values:
  #     pending: Backlog
  #     in_progress: In Progress
  #     done: Shipped
  #     blocked: Blocked
  status_values: {}
